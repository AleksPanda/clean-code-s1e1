<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>

<body class="page">
  <header class="header">
    <img src="./eisenhower-matrix.jpg" class="header__image" alt="Eisenhower Matrix priority diagram">
    <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </header>

  <main class="main">
    <section class="form">
      <label for="newTask" class="form__label">Add Item</label>
      <div class="form__row">
        <input id="newTask" class="form__input" type="text">
        <button type="button" class="form__button btn">Add</button>
      </div>
    </section>
    
    <h2 class="main__title">Todo</h2>
    <ul id="incompleteTasks" class="tasks">
      <li class="task">
        <input type="checkbox" class="task__checkbox" aria-label="Toggle task completion">
        <label class="task__label">Pay Bills</label>
        <input type="text" class="task__input" aria-label="Edit task">
        <button type="button" class="task__edit btn">Edit</button>
        <button type="button" class="task__delete btn">
          <img src="./remove.svg" class="task__delete-icon" alt="Delete task">
        </button>
      </li>
      <li class="task_editing task">
        <input type="checkbox" class="task__checkbox" aria-label="Toggle task completion">
        <label class="task__label">Go Shopping</label>
        <input type="text" value="Go Shopping" class="task__input" aria-label="Edit task">
        <button type="button" class="task__edit btn">Save</button>
        <button type="button" class="task__delete btn">
          <img src="./remove.svg" class="task__delete-icon" alt="Delete task">
        </button>
      </li>
    </ul>
    <h2 class="main__title">Completed</h2>
    <ul id="completedTasks" class="tasks">
      <li class="task">
        <input type="checkbox" checked class="task__checkbox" aria-label="Toggle task completion">
        <label class="task__label">See the Doctor</label>
        <input type="text" class="task__input" aria-label="Edit task">
        <button type="button" class="task__edit btn">Edit</button>
        <button type="button" class="task__delete btn">
          <img src="./remove.svg" class="task__delete-icon" alt="Delete task">
        </button>
      </li>
    </ul>
  </main>

  <script src="app.js"></script>
</body>

</html>
