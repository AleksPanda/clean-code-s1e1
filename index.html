<!DOCTYPE html>
<html lang="en">

<head>
  <title>Todo App</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>

<body class="page">
  <div class="header-section">
    <img src="./eisenhower-matrix.jpg" class="header-img">
    <a class="more-inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </div>

  <div class="main-section">
    <div id="addTaskSection">
      <label for="newTask" class="add-item-label">Add Item</label>
      <div class="task-row-wrapper">
        <input id="newTask" class="task" type="text">
        <button class="btn">Add</button>
      </div>
    </div>
    
    <h3 class="section-title">Todo</h3>
    <ul id="incompleteTasks" class="task-list">
      <li class="task-item">
        <input type="checkbox" class="task-checkbox">
        <label class="task">Pay Bills</label>
        <input type="text" class="task">
        <button class="edit btn">Edit</button>
        <button class="delete btn">
          <img src="./remove.svg" class="btn-img">
        </button>
      </li>
      <li class="edit-mode task-item">
        <input type="checkbox" class="task-checkbox">
        <label class="task">Go Shopping</label>
        <input type="text" value="Go Shopping" class="task">
        <button class="edit btn">Save</button>
        <button class="delete btn">
          <img src="./remove.svg" class="btn-img">
        </button>
      </li>
    </ul>
    <h3 class="section-title">Completed</h3>
    <ul id="completedTasks" class="task-list">
      <li class="task-item">
        <input type="checkbox" checked class="task-checkbox">
        <label class="task">See the Doctor</label>
        <input type="text" class="task">
        <button class="edit btn">Edit</button>
        <button class="delete btn">
          <img src="./remove.svg" class="btn-img">
        </button>
      </li>
    </ul>
  </div>

  <script src="app.js"></script>
</body>

</html>
